<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0615">
<title>AIVA : FIRST CONTACT｜開始你的第一次連結</title>
<style>
:root{
  --bg:#090511; --panel:rgba(25,15,43,.84); --panel2:rgba(18,10,32,.92);
  --violet:#9c6cff; --violet2:#c07aff; --lav:#e6dcff; --text:#fbf8ff;
  --muted:#bcaed1; --line:rgba(195,166,255,.28); --pink:#ec8cff;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:
  radial-gradient(circle at 80% 10%,rgba(128,70,230,.18),transparent 34%),
  radial-gradient(circle at 12% 55%,rgba(216,96,255,.10),transparent 30%),
  var(--bg);color:var(--text);font-family:Inter,"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;}
button,a{font:inherit}
.hero-image-wrap{position:relative;width:100%;max-width:1600px;margin:0 auto;background:#05030b;line-height:0;overflow:hidden;box-shadow:0 28px 90px rgba(0,0,0,.45)}
.hero-image{display:block;width:100%;height:auto;object-fit:contain;user-select:none;-webkit-user-drag:none}
.hero-hotspot{position:absolute;left:40.4%;top:87.4%;width:19.4%;height:7.7%;border:0;border-radius:999px;background:transparent;cursor:pointer;line-height:normal;padding:0;outline:none}
.hero-hotspot:focus-visible{outline:3px solid rgba(236,209,255,.95);outline-offset:3px;box-shadow:0 0 28px rgba(173,100,255,.78)}
.hero-hotspot:hover{box-shadow:0 0 24px rgba(164,94,255,.34)}
.page{width:min(1120px,92vw);margin:0 auto;padding:42px 0 64px}
.quiz-head{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:20px}
.quiz-logo{width:min(260px,48vw);height:auto;display:block}
.quiz-kicker{font-size:12px;letter-spacing:.24em;color:var(--lav);text-transform:uppercase}
.glass{background:linear-gradient(145deg,rgba(35,20,61,.88),rgba(18,10,31,.90));border:1px solid var(--line);box-shadow:0 18px 60px rgba(0,0,0,.34),inset 0 1px 0 rgba(255,255,255,.05);backdrop-filter:blur(10px)}
.quiz{border-radius:26px;padding:28px}
.progress{height:7px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden;margin-bottom:28px}
#bar{height:100%;width:0;background:linear-gradient(90deg,var(--violet),var(--pink));transition:width .28s ease}
.q{display:none}
.q.active{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:.3;transform:translateY(8px)}to{opacity:1;transform:none}}
.q h2{font-size:clamp(22px,3vw,32px);margin:0 0 20px;line-height:1.4}
.options{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.option{appearance:none;border:1px solid rgba(202,177,255,.24);background:rgba(255,255,255,.035);color:var(--text);padding:18px 20px;border-radius:16px;cursor:pointer;text-align:left;transition:.18s ease;line-height:1.55}
.option:hover{transform:translateY(-1px);border-color:rgba(202,177,255,.52);background:rgba(159,98,255,.09)}
.option.selected{border-color:#bc87ff;background:linear-gradient(135deg,rgba(139,92,246,.26),rgba(232,121,249,.13));box-shadow:0 0 0 1px rgba(197,151,255,.22) inset,0 0 28px rgba(132,76,221,.18)}
.controls,.action-row{display:flex;gap:12px;justify-content:flex-end;flex-wrap:wrap;margin-top:24px}
.btn{border:1px solid var(--line);background:rgba(255,255,255,.045);color:var(--text);padding:12px 18px;border-radius:999px;cursor:pointer;transition:.18s ease}
.btn:hover{transform:translateY(-1px);border-color:rgba(226,207,255,.58)}
.btn.primary{border-color:rgba(211,178,255,.56);background:linear-gradient(135deg,#6f45d8,#a65cea);box-shadow:0 8px 28px rgba(119,65,214,.27)}
.result{display:none;margin-top:34px}
.result.show{display:block;animation:fade .3s ease}
.result-title{text-align:center;margin:0 0 18px}
.result-title .eyebrow{font-size:12px;letter-spacing:.23em;color:var(--lav)}
.result-title h2{font-size:clamp(28px,4vw,44px);margin:8px 0 0}
.result-card-frame{border-radius:24px;padding:12px;overflow:hidden}
.result-card-image{display:block;width:100%;height:auto;border-radius:18px;background:#11091d}
.result-copy{margin-top:18px;border-radius:22px;padding:22px 24px}
.result-copy h3{margin:0 0 10px;font-size:24px}
.result-copy p{margin:0;color:#ddd3ef;line-height:1.85}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.tag{font-size:13px;color:#eadfff;border:1px solid rgba(204,176,255,.24);border-radius:999px;padding:7px 11px;background:rgba(255,255,255,.035)}
.result-line{margin-top:16px;padding-top:16px;border-top:1px solid rgba(203,177,255,.16);color:#f1eaff;font-weight:700}
.notice{margin:28px 0 0;text-align:center;font-size:12px;color:#9f93b4;line-height:1.6}
.footer{padding:16px 0 42px;text-align:center;color:#8f80a7;font-size:12px;letter-spacing:.08em}
@media(max-width:780px){
  .page{width:min(94vw,720px);padding-top:28px}
  .quiz{padding:20px}
  .quiz-head{align-items:flex-start;flex-direction:column}
  .quiz-logo{width:230px;max-width:70vw}
  .options{grid-template-columns:1fr}
  .hero-hotspot{left:39.8%;top:86.8%;width:20.5%;height:9%}
  .controls,.action-row{justify-content:stretch}
  .controls .btn,.action-row .btn{flex:1 1 150px}
}
</style>
</head>
<body>
<header class="hero-image-wrap" aria-label="AIVA FIRST CONTACT 活動首頁">
  <img class="hero-image" src="assets/activity-home.png" alt="AIVA FIRST CONTACT 活動首頁：開始你的第一次連結">
  <button class="hero-hotspot" id="heroStart" type="button" aria-label="立即開始連結，前往測驗" title="立即開始連結"></button>
</header>

<main class="page">
  <section id="quiz" aria-labelledby="quizTitle">
    <div class="quiz-head">
      <img class="quiz-logo" src="assets/aiva-logo.png" alt="AIVA 品牌標誌">
      <div>
        <div class="quiz-kicker">AIVA : FIRST CONTACT</div>
        <div id="quizTitle" style="font-size:clamp(18px,2.2vw,24px);font-weight:750;margin-top:6px">找出最適合你的 AIVA 陪伴模式</div>
      </div>
    </div>

    <div class="glass quiz" id="quizBox">
      <div class="progress" aria-label="測驗進度"><div id="bar"></div></div>

      <div class="q active">
        <h2>Q1｜你最常希望 AI 在什麼時候出現？</h2>
        <div class="options">
          <button class="option" data-v="focus">工作或讀書時，幫我整理重點</button>
          <button class="option" data-v="warm">疲累時，陪我聊幾句</button>
          <button class="option" data-v="remind">行程很多時，提醒重要事情</button>
          <button class="option" data-v="fun">放鬆時，一起聊興趣或娛樂</button>
        </div>
      </div>

      <div class="q">
        <h2>Q2｜你希望她怎麼「記得你」？</h2>
        <div class="options">
          <button class="option" data-v="focus">記得我的目標與正在做的事</button>
          <button class="option" data-v="warm">記得我的習慣與偏好</button>
          <button class="option" data-v="remind">記得我的行程與待辦</button>
          <button class="option" data-v="fun">記得我喜歡的作品與話題</button>
        </div>
      </div>

      <div class="q">
        <h2>Q3｜離開電腦後，你最希望什麼延續到手機？</h2>
        <div class="options">
          <button class="option" data-v="focus">剛才的工作脈絡</button>
          <button class="option" data-v="warm">剛才的對話與情緒</button>
          <button class="option" data-v="remind">接下來的提醒與任務</button>
          <button class="option" data-v="fun">同一個角色與聊天氛圍</button>
        </div>
      </div>

      <div class="q">
        <h2>Q4｜你更喜歡哪種互動方式？</h2>
        <div class="options">
          <button class="option" data-v="focus">簡潔、有效率</button>
          <button class="option" data-v="warm">溫柔、有回應感</button>
          <button class="option" data-v="remind">主動但不打擾</button>
          <button class="option" data-v="fun">輕鬆、有趣</button>
        </div>
      </div>

      <div class="controls" id="quizControls">
        <button class="btn" id="prev" type="button">上一步</button>
        <button class="btn primary" id="next" type="button">下一步</button>
      </div>
    </div>

    <section class="result" id="result" aria-live="polite">
      <div class="result-title">
        <div class="eyebrow">YOUR COMPANION PROFILE</div>
        <h2 id="mode"></h2>
      </div>

      <div class="glass result-card-frame">
        <img id="resultImage" class="result-card-image" alt="AIVA 測驗結果卡">
      </div>

      <div class="glass result-copy">
        <h3>你的陪伴模式</h3>
        <p id="desc"></p>
        <div class="tags" id="tags"></div>
        <div class="result-line" id="cardLine"></div>
      </div>

      <div class="action-row">
        <button class="btn" id="restartBtn" type="button">重新測驗</button>
        <button class="btn" id="copyBtn" type="button">複製分享文字</button>
        <button class="btn primary" id="downloadBtn" type="button">下載結果卡 PNG</button>
      </div>
    </section>

    <div class="notice">📌 本頁為課程學術專案模擬，所有產品與活動皆為虛構，不涉及實際商業交易。</div>
  </section>
</main>
<div class="footer">AIVA · From Desktop to Life, She Stays With You.</div>

<script>
const RESULT_DATA = {
  focus: {
    title:'Focus Companion｜專注陪伴型',
    desc:'你偏好清楚、有效率的陪伴。AIVA 會在工作與學習時協助整理、提醒與延續任務脈絡。',
    tags:['專注','整理','效率'],
    line:'陪你完成，而不是打斷你。',
    img:'assets/result-focus.png',
    file:'AIVA_專注陪伴型_結果卡.png'
  },
  warm: {
    title:'Warm Companion｜溫暖陪伴型',
    desc:'你重視被理解的感覺。AIVA 會用溫和、有回應感的方式陪伴日常，讓對話在不同裝置間延續。',
    tags:['理解','陪伴','溫柔'],
    line:'在你需要時，我還在。',
    img:'assets/result-warm.png',
    file:'AIVA_溫暖陪伴型_結果卡.png'
  },
  remind: {
    title:'Life Management Companion｜生活管理型',
    desc:'你需要的是不打擾、但可靠的生活協助。AIVA 會記得待辦、行程與重要節點，在適合的時候提醒你。',
    tags:['提醒','行程','可靠'],
    line:'重要的事，我陪你記得。',
    img:'assets/result-life.png',
    file:'AIVA_生活管理型_結果卡.png'
  },
  fun: {
    title:'Leisure Interactive Companion｜休閒互動型',
    desc:'你希望 AI 不只實用，也能一起聊興趣、娛樂與生活。AIVA 會維持熟悉的角色感與互動氛圍。',
    tags:['休閒','興趣','互動'],
    line:'不只工作，也一起生活。',
    img:'assets/result-leisure.png',
    file:'AIVA_休閒互動型_結果卡.png'
  }
};

const qs=[...document.querySelectorAll('.q')];
const bar=document.getElementById('bar');
const next=document.getElementById('next');
const prev=document.getElementById('prev');
const result=document.getElementById('result');
const quizControls=document.getElementById('quizControls');
const heroStart=document.getElementById('heroStart');
let idx=0;
let answers=new Array(qs.length).fill(null);
let currentResult=null;

function refresh(){
  qs.forEach((q,i)=>q.classList.toggle('active',i===idx));
  bar.style.width=((idx)/qs.length*100)+'%';
  prev.style.visibility=idx===0?'hidden':'visible';
  next.textContent=idx===qs.length-1?'查看結果':'下一步';
}

heroStart.addEventListener('click',()=>{
  document.getElementById('quiz').scrollIntoView({behavior:'smooth',block:'start'});
  setTimeout(()=>{ const first=qs[0].querySelector('.option'); if(first) first.focus({preventScroll:true}); },550);
});

document.querySelectorAll('.option').forEach(btn=>btn.addEventListener('click',()=>{
  const q=btn.closest('.q');
  const qIndex=qs.indexOf(q);
  q.querySelectorAll('.option').forEach(b=>b.classList.remove('selected'));
  btn.classList.add('selected');
  answers[qIndex]=btn.dataset.v;
}));

prev.addEventListener('click',()=>{
  if(idx>0){ idx--; refresh(); }
});

next.addEventListener('click',()=>{
  if(!answers[idx]){ alert('請先選擇一個選項'); return; }
  if(idx<qs.length-1){ idx++; refresh(); return; }

  const count={focus:0,warm:0,remind:0,fun:0};
  answers.forEach(a=>count[a]++);
  const max=Math.max(...Object.values(count));
  const tied=Object.keys(count).filter(k=>count[k]===max);
  const top=tied.length===1 ? tied[0] : answers.find(a=>tied.includes(a));
  currentResult=RESULT_DATA[top];

  qs.forEach(q=>q.style.display='none');
  quizControls.style.display='none';
  bar.style.width='100%';

  document.getElementById('mode').textContent=currentResult.title;
  document.getElementById('desc').textContent=currentResult.desc;
  document.getElementById('tags').innerHTML=currentResult.tags.map(x=>'<span class="tag">#'+x+'</span>').join('');
  document.getElementById('cardLine').textContent=currentResult.line;
  const img=document.getElementById('resultImage');
  img.src=currentResult.img;
  img.alt='AIVA '+currentResult.title+' 結果卡';
  result.classList.add('show');
  result.scrollIntoView({behavior:'smooth',block:'start'});
});

document.getElementById('downloadBtn').addEventListener('click',()=>{
  if(!currentResult) return;
  const a=document.createElement('a');
  a.href=currentResult.img;
  a.download=currentResult.file;
  document.body.appendChild(a);
  a.click();
  a.remove();
});

document.getElementById('copyBtn').addEventListener('click',async()=>{
  if(!currentResult) return;
  const text=`我的 AIVA Companion Profile：${currentResult.title}
${currentResult.line}
#AIVA #FIRST_CONTACT`;
  try{
    await navigator.clipboard.writeText(text);
    const btn=document.getElementById('copyBtn');
    const old=btn.textContent; btn.textContent='已複製 ✓'; setTimeout(()=>btn.textContent=old,1400);
  }catch(e){
    window.prompt('複製以下分享文字：',text);
  }
});

document.getElementById('restartBtn').addEventListener('click',()=>{
  idx=0; answers=new Array(qs.length).fill(null); currentResult=null;
  document.querySelectorAll('.option').forEach(b=>b.classList.remove('selected'));
  qs.forEach(q=>q.style.display='');
  quizControls.style.display='flex';
  result.classList.remove('show');
  refresh();
  document.getElementById('quiz').scrollIntoView({behavior:'smooth',block:'start'});
});

refresh();
</script>
</body>
</html>
