<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0615">
<title>AIVA : FIRST CONTACT｜開始你的第一次連結</title>
<link rel="stylesheet" href="style-min.css">
</head>
<body>
<header class="hero-image-wrap" aria-label="AIVA FIRST CONTACT 活動首頁">
  <img class="hero-image" src="assets/activity-home.webp" alt="AIVA FIRST CONTACT 活動首頁：開始你的第一次連結">
  <button class="hero-hotspot" id="heroStart" type="button" aria-label="立即開始連結，前往測驗" title="立即開始連結"></button>
</header>

<main class="page">
  <section id="quiz" aria-labelledby="quizTitle">
    <div class="quiz-head">
      <img class="quiz-logo" src="assets/aiva-logo.webp" alt="AIVA 品牌標誌">
      <div>
        <div class="quiz-kicker">AIVA : FIRST CONTACT</div>
        <div id="quizTitle" style="font-size:clamp(18px,2.2vw,24px);font-weight:750;margin-top:6px">找出最適合你的 AIVA 陪伴模式</div>
      </div>
    </div>

    <div class="glass quiz" id="quizBox">
      <div class="progress" aria-label="測驗進度"><div id="bar"></div></div>

      <div class="q active">
        <h2>Q1｜你最常希望 AI 在什麼時候出現？</h2>
        <div class="options">
          <button class="option" data-v="focus">工作或讀書時，幫我整理重點</button>
          <button class="option" data-v="warm">疲累時，陪我聊幾句</button>
          <button class="option" data-v="remind">行程很多時，提醒重要事情</button>
          <button class="option" data-v="fun">放鬆時，一起聊興趣或娛樂</button>
        </div>
      </div>

      <div class="q">
        <h2>Q2｜你希望她怎麼「記得你」？</h2>
        <div class="options">
          <button class="option" data-v="focus">記得我的目標與正在做的事</button>
          <button class="option" data-v="warm">記得我的習慣與偏好</button>
          <button class="option" data-v="remind">記得我的行程與待辦</button>
          <button class="option" data-v="fun">記得我喜歡的作品與話題</button>
        </div>
      </div>

      <div class="q">
        <h2>Q3｜離開電腦後，你最希望什麼延續到手機？</h2>
        <div class="options">
          <button class="option" data-v="focus">剛才的工作脈絡</button>
          <button class="option" data-v="warm">剛才的對話與情緒</button>
          <button class="option" data-v="remind">接下來的提醒與任務</button>
          <button class="option" data-v="fun">同一個角色與聊天氛圍</button>
        </div>
      </div>

      <div class="q">
        <h2>Q4｜你更喜歡哪種互動方式？</h2>
        <div class="options">
          <button class="option" data-v="focus">簡潔、有效率</button>
          <button class="option" data-v="warm">溫柔、有回應感</button>
          <button class="option" data-v="remind">主動但不打擾</button>
          <button class="option" data-v="fun">輕鬆、有趣</button>
        </div>
      </div>

      <div class="controls" id="quizControls">
        <button class="btn" id="prev" type="button">上一步</button>
        <button class="btn primary" id="next" type="button">下一步</button>
      </div>
    </div>

    <section class="result" id="result" aria-live="polite">
      <div class="result-title">
        <div class="eyebrow">YOUR COMPANION PROFILE</div>
        <h2 id="mode"></h2>
      </div>

      <div class="glass result-card-frame">
        <img id="resultImage" class="result-card-image" alt="AIVA 測驗結果卡">
      </div>

      <div class="glass result-copy">
        <h3>你的陪伴模式</h3>
        <p id="desc"></p>
        <div class="tags" id="tags"></div>
        <div class="result-line" id="cardLine"></div>
      </div>

      <div class="action-row">
        <button class="btn" id="restartBtn" type="button">重新測驗</button>
        <button class="btn" id="copyBtn" type="button">複製分享文字</button>
        <button class="btn primary" id="downloadBtn" type="button">下載結果卡 webp</button>
      </div>
    </section>

    <div class="notice">本頁為課程學術專案模擬，所有產品與活動皆為虛構，不涉及實際商業交易。</div>
  </section>
</main>
<div class="footer">AIVA &copy From Desktop to Life, She Stays With You.</div>

<script src="script-min.js"></script>
</body>
</html>
